<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب منصور | تجربة احترافية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --brand-green: #08542d;
            --brand-blue: #013ea8;
            --brand-gold: #d4923b;
            --bg-dark: #020503; /* خلفية داكنة جداً مستمدة من الأخضر */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            /* خلفية متدرجة تعتمد فقط على الأخضر والأزرق */
            background: radial-gradient(circle at top right, var(--brand-green), var(--bg-dark)),
                        radial-gradient(circle at bottom left, var(--brand-blue), var(--bg-dark));
        }

        header {
            margin-top: 40px;
            text-align: center;
            z-index: 10;
        }

        /* صورة الشعار في الأعلى */
        .main-logo {
            max-width: 250px;
            height: auto;
            filter: drop-shadow(0 0 10px var(--brand-gold));
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--brand-gold);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            gap: 35px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 50px 20px;
            max-width: 1200px;
        }

        /* كرت اللعبة الموحد بالألوان المطلوبة */
        .game-card {
            position: relative;
            width: 300px;
            height: 420px;
            background: rgba(255, 255, 255, 0.03); /* زجاج شفاف */
            border-radius: 25px;
            border: 2px solid var(--brand-blue);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 35px 20px;
            text-decoration: none;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
        }

        .game-card:hover {
            border-color: var(--brand-gold);
            box-shadow: 0 0 30px rgba(212, 146, 59, 0.3);
            transform: translateY(-10px);
        }

        .game-card img {
          
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transform: translateZ(50px);
        }

        .info { text-align: center; transform: translateZ(30px); }

        .game-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .game-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }

        /* الأزرار بالألوان الجديدة */
        .play-btn {
            background: var(--brand-green);
            color: white;
            border: 1px solid var(--brand-gold);
            padding: 10px 35px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            transform: translateZ(40px);
        }

        .game-card:hover .play-btn {
            background: var(--brand-gold);
            color: var(--brand-green);
            box-shadow: 0 0 15px var(--brand-gold);
        }

        /* تذييل الصفحة */
        footer {
            margin-top: auto;
            width: 100%;
            padding: 30px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-top: 2px solid var(--brand-blue);
        }

        .tiktok-link {
            color: var(--brand-gold);
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .dev-tag {
            font-size: 0.9rem;
            color: white;
            opacity: 0.7;
        }

    </style>
</head>
<body>

    <header>
        <img src="https://raw.githubusercontent.com/iMans9/games/refs/heads/main/mansgalogo.png" alt="ألعاب منصور" class="main-logo">
  
        <p>ألعب مع عائلتك أو اصدقائك واستمتع</p>
    </header>

    <div class="container">
        
        <a href="https://imans9.github.io/horof/" class="game-card">
            <img src="https://raw.githubusercontent.com/iMans9/games/refs/heads/main/logo-hororf.png" width="210px" height="140px" alt="الحروف">
            <div class="info">
                <div class="game-title">لعبة الحروف</div>
                <div class="game-desc">سابق الزمن لتوصيل مسارك بين الحروف بنجاح.</div>
            </div>
            <button class="play-btn">ابدأ اللعب</button>
        </a>

        <a href="https://imans9.github.io/fanos/index.html" class="game-card">
            <img src="https://raw.githubusercontent.com/iMans9/games/refs/heads/main/fanos-logo.png" width="240px" height="140px" alt="الدوامة">
            <div class="info">
                <div class="game-title">دوامة الحظ</div>
                <div class="game-desc">لف الدوامة وتوقع الحروف الصحيحة للفوز بالجوائز.</div>
            </div>
            <button class="play-btn">ابدأ اللعب</button>
        </a>

        <a href="https://imans9.github.io/top10" class="game-card">
            <img src="https://raw.githubusercontent.com/iMans9/top10/refs/heads/main/top10.png" width="240px" height="140px" alt="توب 10">
            <div class="info">
                <div class="game-title">توب 10</div>
                <div class="game-desc">خمن الإجابات الأكثر شعبية وتصدر قائمة المتصدرين.</div>
            </div>
            <button class="play-btn">ابدأ اللعب</button>
        </a>

    </div>

    <footer>
        <p>تابعنا على تيك توك للمزيد من الألعاب والتحديثات!</p>
        <a href="https://www.tiktok.com/@mnsgam" class="tiktok-link">@mnsgam</a>
        <div class="dev-tag">تم التطوير بواسطة العاب منصور</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script>
        VanillaTilt.init(document.querySelectorAll(".game-card"), {
            max: 10,
            speed: 500,
            glare: true,
            "max-glare": 0.15,
        });
    </script>
</body>
</html>
